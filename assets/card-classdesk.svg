<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 210" width="100%" height="100%">
  <defs>
    <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181615"/>
      <stop offset="100%" stop-color="#121113"/>
    </linearGradient>
    <linearGradient id="cbdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <style>
    .t { font: 800 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #fbf2e6; }
    .badge { font: 700 11.5px "SF Mono", "Menlo", monospace; fill: #8fd7ff; }
    .p-zh { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #d8c3ae; }
    .p-en { font: 400 12.8px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #9c8672; }
    .tag { font: 600 11.5px "SF Mono", "Menlo", monospace; fill: #c6b09b; }
  </style>
  <rect x="1.5" y="1.5" width="577" height="207" rx="18" fill="url(#cbg)" stroke="url(#cbdr)" stroke-width="1.5"/>
  <g transform="translate(26, 26)">
    <rect x="0" y="0" width="40" height="40" rx="11" fill="#1a242b" stroke="#7dcfff" stroke-opacity="0.38"/>
    <text x="11" y="27" font-size="20">📋</text>
    <text x="54" y="27" class="t">老师工作台 · ClassDesk</text>
    <rect x="412" y="5" width="116" height="26" rx="13" fill="#19232a" stroke="#7dcfff" stroke-opacity="0.35"/>
