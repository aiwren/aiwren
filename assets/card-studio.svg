<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 144" width="100%" height="100%">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191614"/>
      <stop offset="100%" stop-color="#131112"/>
    </linearGradient>
    <linearGradient id="sbdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ece6a" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ffb86b" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <style>
    .t { font: 800 20.5px -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; fill: #fbf2e6; }
    .badge { font: 700 11.5px "SF Mono", "Menlo", monospace; fill: #a7db74; }
    .p-en { font: 400 13.8px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #DEC7B0; }
    .p-zh { font: 400 12.5px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #9c8672; }
    .tag { font: 600 11.5px "SF Mono", "Menlo", monospace; fill: #c6b09b; }
  </style>
  <rect x="1.5" y="1.5" width="1177" height="141" rx="18" fill="url(#sbg)" stroke="url(#sbdr)" stroke-width="1.5"/>
  <g transform="translate(26, 22)">
    <rect x="0" y="0" width="38" height="38" rx="11" fill="#1e261a" stroke="#9ece6a" stroke-opacity="0.4"/>
    <text x="10" y="26" font-size="19">🏠</text>
    <text x="52" y="26" class="t">TinkerAI Window Studio · 窗边工作间 (tinkerai.cn)</text>
    <rect x="975" y="5" width="152" height="26" rx="13" fill="#1e2519" stroke="#9ece6a" stroke-opacity="0.35"/>
    <text x="992" y="22.5" class="badge">INTERACTIVE 3D</text>

    <text x="0" y="60" class="p-en">An interactive isometric 3D Blender studio distilled from a 26 MB scene into a 49 KB first frame with ray-cast SVG contours and localized WebP motion strips.</text>
    <text x="0" y="80" class="p-zh">用 Blender 搭一间窗边工作间，通过相机射线拾取精确 SVG 轮廓与局部动作图条，把 26 MB 场景浓缩成 49 KB 的可交互个人主页。</text>

    <g transform="translate(0, 92)">
      <circle cx="6" cy="11" r="5" fill="#9ece6a"/>
      <text x="18" y="15" class="tag">Next.js · Blender 5 · Cycles · Ray-Cast SVG Contours · HTML5 Canvas</text>
      <text x="998" y="15" class="badge">Visit tinkerai.cn ↗</text>
    </g>
  </g>
</svg>
