<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 186" width="100%" height="100%">
  <defs>
    <linearGradient id="gbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191513"/>
      <stop offset="100%" stop-color="#121011"/>
    </linearGradient>
    <linearGradient id="gbdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb86b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <style>
    .t { font: 800 21px -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; fill: #fbf2e6; }
    .badge { font: 700 11.5px "SF Mono", "Menlo", monospace; fill: #ffca80; }
    .p-en { font: 400 13.8px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #DEC7B0; }
    .p-zh { font: 400 12.5px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #9c8672; }
    .tag { font: 600 11.5px "SF Mono", "Menlo", monospace; fill: #c6b09b; }
  </style>
  <rect x="1.5" y="1.5" width="577" height="183" rx="18" fill="url(#gbg)" stroke="url(#gbdr)" stroke-width="1.5"/>
  <g transform="translate(26, 24)">
    <rect x="0" y="0" width="38" height="38" rx="11" fill="#2b211a" stroke="#ffb86b" stroke-opacity="0.4"/>
    <text x="10" y="26" font-size="19">✨</text>
    <text x="52" y="26" class="t">FleetingGleam · 惊鸿</text>
    <rect x="424" y="5" width="104" height="26" rx="13" fill="#2c2119" stroke="#ffb86b" stroke-opacity="0.35"/>
    <text x="440" y="22.5" class="badge">OPEN SOURCE</text>

    <text x="0" y="64" class="p-en">On-device photo culling for macOS &amp; Android. Burst grouping, explainable</text>
    <text x="0" y="84" class="p-en">multi-metric scoring, RAW+JPG pairing &amp; local search — nothing uploaded.</text>
    <text x="0" y="108" class="p-zh">运行在 Mac 与安卓上的开源本地照片筛选工具，连拍分组、可解释评分与直连 NAS。</text>

    <g transform="translate(0, 126)">
      <circle cx="6" cy="11" r="5" fill="#dea584"/>
      <text x="18" y="15" class="tag">Rust · Tauri 2 · Swift · Kotlin · AGPL-3.0</text>
      <text x="448" y="15" class="badge">macOS / Android ↗</text>
    </g>
  </g>
</svg>
